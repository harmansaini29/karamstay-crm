[project]
name = "karamstay-backend"
version = "0.1.0"
description = "KaramStay FastAPI backend"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.13.0",
  "apscheduler>=3.10.0",
  "argon2-cffi>=23.1.0",
  "boto3>=1.34.0",
  "email-validator>=2.1.0",
  "fastapi>=0.115.0",
  "firebase-admin>=6.5.0",
  "fpdf2>=2.7.0",
  "gunicorn>=22.0.0",
  "httpx>=0.27.0",
  "passlib[argon2]>=1.7.4",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.4.0",
  "python-jose[cryptography]>=3.3.0",
  "slowapi>=0.1.9",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.30.0"
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
