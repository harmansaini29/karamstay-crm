name: Backend CI/CD

# Test-and-lint on every push/PR that touches the backend. Build+push to ECR
# and deploy to App Runner only happen on pushes to main, and deploy is
# gated behind a "production" GitHub Environment that requires a human
# approval (configure that under Settings -> Environments in the repo —
# this workflow file alone does not grant approval).
#
# Required repo configuration (see infra/runbook.md for details):
#   Variables (Settings -> Secrets and variables -> Actions -> Variables):
#     AWS_REGION                 e.g. ap-south-1
#     AWS_OIDC_ROLE_ARN          IAM role ARN this workflow assumes via OIDC
#     ECR_REPOSITORY_URL         output of `terraform output ecr_repository_url`
#     APPRUNNER_SERVICE_ARN      output of `terraform output apprunner_service_arn`
#   No static AWS access keys are used anywhere in this workflow.

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci-cd.yml"
  pull_request:
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci-cd.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/backend

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: karamstay
          POSTGRES_PASSWORD: karamstay
          POSTGRES_DB: karamstay
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U karamstay"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://karamstay:karamstay@localhost:5432/karamstay
      JWT_SECRET_KEY: ci-test-secret-key-at-least-32-characters-long
      RATE_LIMIT_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # No explicit "wait for postgres" step needed: the `options:
      # --health-cmd=...` block on the postgres service above makes GitHub
      # Actions block these steps from starting until the container reports
      # healthy.
      - name: Run migrations against the service container
        run: alembic upgrade head

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest

  build-and-push:
    name: Build & push image
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC -> AssumeRoleWithWebIdentity
      contents: read
    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          docker build \
            -f apps/backend/Dockerfile \
            -t "${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}" \
            apps/backend
        working-directory: ${{ github.workspace }}

      - name: Push image to ECR
        id: image
        run: |
          docker push "${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}"
          echo "image_uri=${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to App Runner
    needs: build-and-push
    runs-on: ubuntu-latest
    # Requires a repo Environment named "production" configured with
    # required reviewers under Settings -> Environments. The job will pause
    # here until someone approves it.
    environment: production
    concurrency:
      group: backend-prod-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials (OIDC, no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Point App Runner at the new image
        run: |
          aws apprunner update-service \
            --service-arn "${{ vars.APPRUNNER_SERVICE_ARN }}" \
            --source-configuration "{\"ImageRepository\":{\"ImageIdentifier\":\"${{ needs.build-and-push.outputs.image_uri }}\",\"ImageRepositoryType\":\"ECR\"}}"

      - name: Wait for deployment to finish
        run: |
          for i in $(seq 1 60); do
            status=$(aws apprunner describe-service \
              --service-arn "${{ vars.APPRUNNER_SERVICE_ARN }}" \
              --query "Service.Status" --output text)
            echo "Service status: $status"
            if [ "$status" = "RUNNING" ]; then
              echo "Deployment finished successfully."
              exit 0
            fi
            if [ "$status" != "OPERATION_IN_PROGRESS" ]; then
              echo "Unexpected service status: $status" >&2
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for App Runner deployment to finish" >&2
          exit 1
