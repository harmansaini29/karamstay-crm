name: Backend CI/CD

# Lint and test on every push/PR touching the backend.
# Build + push to ECR and deploy to ECS on pushes to main only,
# gated behind the 'production' GitHub Environment (requires human approval —
# configure under Settings -> Environments).
#
# Required repo variables (Settings -> Secrets and variables -> Actions -> Variables tab):
#   AWS_REGION              e.g. ap-south-1
#   AWS_OIDC_ROLE_ARN       output of 	erraform output github_actions_role_arn
#   ECR_REPOSITORY_URL      output of 	erraform output ecr_repository_url
#   ECS_CLUSTER_NAME        output of 	erraform output ecs_cluster_name
#   ECS_SERVICE_NAME        output of 	erraform output ecs_service_name
#
# No static AWS access keys are stored anywhere in this workflow.

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci-cd.yml"
  pull_request:
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci-cd.yml"

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'ap-south-1' }}
  AWS_OIDC_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN || secrets.AWS_OIDC_ROLE_ARN || 'arn:aws:iam::907079642634:role/karamstay-prod-github-actions' }}
  ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL || secrets.ECR_REPOSITORY_URL || '907079642634.dkr.ecr.ap-south-1.amazonaws.com/karamstay-prod-backend' }}
  ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME || secrets.ECS_CLUSTER_NAME || 'karamstay-prod' }}
  ECS_SERVICE_NAME: ${{ vars.ECS_SERVICE_NAME || secrets.ECS_SERVICE_NAME || 'karamstay-prod-service' }}

defaults:
  run:
    working-directory: apps/backend

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: karamstay
          POSTGRES_PASSWORD: karamstay
          POSTGRES_DB: karamstay
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U karamstay"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://karamstay:karamstay@localhost:5432/karamstay
      JWT_SECRET_KEY: ci-test-secret-key-at-least-32-characters-long
      RATE_LIMIT_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run migrations
        run: alembic upgrade head

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest

  build-and-push:
    name: Build & push image to ECR
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC AssumeRoleWithWebIdentity
      contents: read
    outputs:
      image_uri: ${{ steps.push.outputs.image_uri }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug AWS OIDC configuration
        run: |
          echo "Role to assume: ${{ env.AWS_OIDC_ROLE_ARN }}"
          echo "AWS Region: ${{ env.AWS_REGION }}"
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"

      - name: Configure AWS credentials (OIDC — no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        working-directory: ${{ github.workspace }}
        run: |
          docker build \
            -f apps/backend/Dockerfile \
            -t "${{ env.ECR_REPOSITORY_URL }}:${{ github.sha }}" \
            apps/backend

      - name: Push image to ECR
        id: push
        run: |
          docker push "${{ env.ECR_REPOSITORY_URL }}:${{ github.sha }}"
          echo "image_uri=${{ env.ECR_REPOSITORY_URL }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Amazon ECS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production          # pauses for human approval in GitHub UI
    concurrency:
      group: backend-prod-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials (OIDC — no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Update ECS task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: karamstay-prod
          container-name: api
          image: ${{ needs.build-and-push.outputs.image_uri }}

      - name: Deploy to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_NAME }}
          cluster: ${{ env.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true
          wait-for-minutes: 15
